<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Belvo Attendance Tracker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="header-branding">
        <div class="header-icon">📅</div>
        <div>
          <h1 class="header-title">Belvo Attendance</h1>
          <p class="header-subtitle">Gmail Work Report Automation</p>
        </div>
      </div>
      <div id="connection-status" class="status-badge status-offline">
        <span class="status-dot"></span>
        <span id="connection-text">Connecting...</span>
      </div>
    </header>

    <!-- Configuration Card -->
    <section class="card config-card">
      <div class="form-group">
        <label for="mode-select">Data Source Mode</label>
        <select id="mode-select" class="form-control">
          <option value="mock" selected>Mock Mode (Safe / Offline Demo)</option>
          <option value="gmail">Gmail API (Real Mailbox)</option>
        </select>
      </div>

      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
          <label for="target-date" style="margin-bottom: 0;">Attendance Date</label>
          <button id="btn-today" type="button" class="btn btn-outline btn-sm" style="flex: none; width: auto; padding: 2px 8px; font-size: 11px;">📅 Today</button>
        </div>
        <input type="date" id="target-date" class="form-control" value="2026-09-17">
      </div>

      <!-- Action Buttons -->
      <div class="button-group">
        <button id="btn-scan" class="btn btn-secondary">
          🔍 Scan Inbox
        </button>
        <button id="btn-process" class="btn btn-primary">
          ⚙️ Process Attendance
        </button>
      </div>

      <div id="gmail-auth-row" class="auth-row hidden" style="flex-direction: column; align-items: stretch;">
        <div style="display: flex; gap: 8px; align-items: center; width: 100%;">
          <button id="btn-connect" class="btn btn-outline btn-sm">
            🔑 Connect with Google
          </button>
          <button id="btn-logout" class="btn btn-outline btn-sm hidden" style="border-color:#ef4444; color:#ef4444;">
            Disconnect
          </button>
          <span id="auth-status-text" class="auth-status-hint"></span>
        </div>
        <div id="manual-token-row" style="margin-top: 8px; width: 100%;">
          <div style="display: flex; gap: 4px;">
            <input type="text" id="input-session-token" placeholder="Paste session token if prompted..." style="flex: 1; font-size: 11px; padding: 4px 6px; border: 1px solid #cbd5e1; border-radius: 4px;">
            <button id="btn-save-token" class="btn btn-outline btn-sm" style="font-size: 11px; padding: 4px 8px;">Apply</button>
          </div>
        </div>
      </div>
    </section>

    <!-- KPI Metric Cards -->
    <section class="card metrics-card">
      <div class="metrics-grid">
        <div class="metric-box">
          <span class="metric-label">Expected</span>
          <span id="metric-total" class="metric-value">-</span>
        </div>
        <div class="metric-box metric-p">
          <span class="metric-label">Present (P)</span>
          <span id="metric-p" class="metric-value">-</span>
        </div>
        <div class="metric-box metric-a">
          <span class="metric-label">Absent (A)</span>
          <span id="metric-a" class="metric-value">-</span>
        </div>
        <div class="metric-box metric-l">
          <span class="metric-label">Leave (L)</span>
          <span id="metric-l" class="metric-value">-</span>
        </div>
      </div>
    </section>

    <!-- Results Table Preview -->
    <section id="results-card" class="card results-card hidden">
      <div class="results-header">
        <h3 class="section-title">Attendance Roster</h3>
        <span id="scan-summary-badge" class="badge"></span>
      </div>
      <div class="table-container">
        <table class="roster-table">
          <thead>
            <tr>
              <th id="th-col1">Person</th>
              <th id="th-col2">Status</th>
              <th id="th-col3">Details</th>
            </tr>
          </thead>
          <tbody id="roster-tbody">
            <!-- Dynamically populated -->
          </tbody>
        </table>
      </div>

      <!-- Audit & Processing Log Section -->
      <div id="logs-container" class="hidden" style="margin-top: 10px; border-top: 1px solid var(--border-color); padding-top: 8px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
          <span style="font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-muted);">Processing Audit Log</span>
          <span id="log-count-badge" class="badge" style="background:#e5e7eb; font-size: 10px; padding: 1px 6px; border-radius: 8px;">0 events</span>
        </div>
        <div id="logs-list" style="max-height: 140px; overflow-y: auto; font-size: 11px; display: flex; flex-direction: column; gap: 5px;">
          <!-- Dynamically populated log entries -->
        </div>
      </div>
    </section>

    <!-- Download Section -->
    <section class="card download-card">
      <button id="btn-download" class="btn btn-success" disabled>
        📥 Download attendance.xlsx
      </button>
    </section>

    <!-- Settings / Endpoint Config Accordion -->
    <div class="endpoint-bar">
      <button id="btn-toggle-settings" class="btn-text">⚙️ Backend Settings</button>
      <div id="settings-panel" class="settings-panel hidden">
        <label for="input-api-url">Backend API Base URL</label>
        <div class="url-input-group">
          <input type="text" id="input-api-url" class="form-control form-control-sm" placeholder="https://<project>.vercel.app or http://127.0.0.1:8000">
          <button id="btn-save-url" class="btn btn-secondary btn-sm">Save</button>
        </div>
      </div>
    </div>

    <!-- Status / Notification Console -->
    <footer class="app-footer">
      <div id="status-console" class="status-console">
        Ready. Select mode and click Scan Inbox or Process Attendance.
      </div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
